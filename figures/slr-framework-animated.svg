<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="2290" viewBox="0 0 1700 2290" font-family="Liberation Sans, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>

    <style>
      .flow { stroke-dasharray: 14 9; animation: dash 0.9s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -23; } }
      .hl { fill: none; stroke: #FF6D00; stroke-width: 7; opacity: 0;
             animation: glow 16.5s ease-in-out infinite; }
      .hl2 { fill: none; stroke: #FFB74D; stroke-width: 20; opacity: 0;
              animation: glow2 16.5s ease-in-out infinite; }
      @keyframes glow  { 0% {opacity:0} 2% {opacity:1} 8% {opacity:1} 12% {opacity:0} 100% {opacity:0} }
      @keyframes glow2 { 0% {opacity:0} 2% {opacity:.35} 8% {opacity:.35} 12% {opacity:0} 100% {opacity:0} }
      .dot { fill: #FF6D00; stroke: #fff; stroke-width: 2; }
      .brace { animation: bracepulse 2.4s ease-in-out infinite; }
      @keyframes bracepulse { 0%,100% {opacity:1} 50% {opacity:.45} }
      @media (prefers-reduced-motion: reduce) {
        .flow, .hl, .hl2, .brace { animation: none; } .dot { display: none; }
      }
    </style>
  </defs>
  <rect width="1700" height="2290" fill="#ffffff"/>

  <!-- Title -->
  <rect x="260" y="20" width="1180" height="70" fill="#FFB366"/>
  <text x="850" y="72" font-size="46" font-weight="bold" text-anchor="middle">SLR Framework and AI Tools by Apri Junaidi</text>

  <!-- ===== STAGE 1: Ideation (top) ===== -->
  <rect x="20" y="130" width="1660" height="480" rx="24" fill="#FFFDF0" stroke="#C9A800" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="50" y="170" font-size="26" font-weight="bold" fill="#8A6D00">Ideation with AI Tools</text>

  <!-- Activities -->
  <rect x="60"  y="215" width="300" height="100" rx="18" fill="#FFFF00" stroke="#000" stroke-width="2"/>
  <text x="210" y="278" font-size="38" text-anchor="middle">Idea</text>
  <rect x="60"  y="345" width="300" height="100" rx="18" fill="#66FF66" stroke="#000" stroke-width="2"/>
  <text x="210" y="408" font-size="36" text-anchor="middle">Brainstorming</text>
  <rect x="60"  y="475" width="300" height="100" rx="18" fill="#FF66B3" stroke="#000" stroke-width="2"/>
  <text x="210" y="538" font-size="38" text-anchor="middle">Prompting</text>

