    <text x="670" y="295" font-size="46" fill="#fff">scite_</text>

    <rect x="870" y="225" width="320" height="110" rx="14" fill="#EEF1FF" stroke="#4D6BFE" stroke-width="3"/>
    <text x="1030" y="295" font-size="44" fill="#4D6BFE">DeepSeek</text>

