<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="2090" viewBox="0 0 1700 2090" font-family="Liberation Sans, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="1700" height="2090" fill="#ffffff"/>

  <!-- Title -->
  <rect x="260" y="20" width="1180" height="70" fill="#FFB366"/>
  <text x="850" y="72" font-size="46" font-weight="bold" text-anchor="middle">SLR Framework and AI Tools by Apri Junaidi</text>

  <!-- ===== STAGE 1: Ideation (top) ===== -->
  <rect x="20" y="130" width="1660" height="480" rx="24" fill="#FFFDF0" stroke="#C9A800" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="50" y="170" font-size="26" font-weight="bold" fill="#8A6D00">Ideation with AI Tools</text>

  <!-- Activities -->
  <rect x="60"  y="215" width="300" height="100" rx="18" fill="#FFFF00" stroke="#000" stroke-width="2"/>
  <text x="210" y="278" font-size="38" text-anchor="middle">Idea</text>
  <rect x="60"  y="345" width="300" height="100" rx="18" fill="#66FF66" stroke="#000" stroke-width="2"/>
  <text x="210" y="408" font-size="36" text-anchor="middle">Brainstorming</text>
  <rect x="60"  y="475" width="300" height="100" rx="18" fill="#FF66B3" stroke="#000" stroke-width="2"/>
  <text x="210" y="538" font-size="38" text-anchor="middle">Prompting</text>

  <!-- Curly brace -->
  <path d="M470,210 C425,220 415,290 415,360 C415,385 405,393 385,397 C405,401 415,409 415,434 C415,505 425,575 470,585"
        fill="none" stroke="#E00000" stroke-width="12" stroke-linecap="round"/>

  <!-- AI tools grid -->
  <g font-weight="bold" text-anchor="middle">
    <rect x="510" y="225" width="320" height="110" rx="14" fill="#0A6CFF"/>
    <text x="670" y="295" font-size="46" fill="#fff">scite_</text>

    <rect x="870" y="225" width="320" height="110" rx="14" fill="#EEF1FF" stroke="#4D6BFE" stroke-width="3"/>
    <text x="1030" y="295" font-size="44" fill="#4D6BFE">DeepSeek</text>

    <rect x="1230" y="225" width="320" height="110" rx="14" fill="#F2EEFF" stroke="#6A4CE0" stroke-width="3"/>
    <text x="1390" y="295" font-size="46" fill="#6A4CE0">Qwen</text>

    <rect x="510" y="375" width="320" height="110" rx="14" fill="#FBF3EC" stroke="#5A3A2A" stroke-width="3"/>
    <text x="670" y="445" font-size="44" fill="#4A2E22">Humata</text>

    <rect x="870" y="375" width="320" height="110" rx="14" fill="#F4F4F4" stroke="#111" stroke-width="3"/>
    <text x="1030" y="445" font-size="44" fill="#111">NotebookLM</text>

    <rect x="1230" y="375" width="320" height="110" rx="14" fill="#FBEDE7" stroke="#D97757" stroke-width="3"/>
    <text x="1390" y="445" font-size="46" fill="#C15F3C">Claude</text>
  </g>
  <text x="1030" y="545" font-size="24" font-style="italic" text-anchor="middle" fill="#444">Explore topics, refine research questions, build keywords and search strings</text>

  <!-- Arrow ideation -> search -->
  <line x1="850" y1="610" x2="850" y2="748" stroke="#000" stroke-width="3" marker-end="url(#arr)"/>
  <text x="870" y="690" font-size="22" font-weight="bold">Keywords / search string</text>

  <!-- ===== STAGE 2: Database and Bibliometric ===== -->
  <rect x="20" y="760" width="160" height="960" rx="22" fill="#FCC8E4" stroke="#000" stroke-width="2"/>
  <text x="0" y="0" font-size="44" text-anchor="middle" transform="translate(115,1240) rotate(-90)">Database and Bibliometric</text>

  <!-- Search Documents -->
  <rect x="700" y="760" width="300" height="120" rx="18" fill="#FF9999" stroke="#000" stroke-width="2"/>
  <text x="850" y="812" font-size="30" font-weight="bold" text-anchor="middle">Search</text>
  <text x="850" y="850" font-size="30" font-weight="bold" text-anchor="middle">Documents</text>
  <line x1="850" y1="880" x2="850" y2="938" stroke="#000" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Export to RIS -->
  <rect x="700" y="940" width="300" height="120" rx="18" fill="#99FF99" stroke="#000" stroke-width="2"/>
  <text x="850" y="1012" font-size="30" font-weight="bold" text-anchor="middle">Export to RIS</text>
  <polyline points="700,1000 420,1000 420,1118" fill="none" stroke="#000" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Zotero -->
  <rect x="270" y="1120" width="300" height="120" rx="18" fill="#FCCACA" stroke="#000" stroke-width="2"/>
  <text x="420" y="1192" font-size="32" font-weight="bold" font-style="italic" text-anchor="middle">Zotero</text>

  <!-- Rayyan -->
  <rect x="1120" y="1120" width="420" height="120" rx="18" fill="#CCFFE6" stroke="#000" stroke-width="2"/>
  <text x="1330" y="1192" font-size="30" font-weight="bold" text-anchor="middle">Rayyan (screening data)</text>

  <line x1="570" y1="1150" x2="1118" y2="1150" stroke="#000" stroke-width="3" marker-end="url(#arr)"/>
  <text x="845" y="1135" font-size="24" font-weight="bold" text-anchor="middle">Screening data = export RIS file to Rayyan</text>
  <line x1="1120" y1="1210" x2="572" y2="1210" stroke="#000" stroke-width="3" marker-end="url(#arr)"/>
  <text x="845" y="1250" font-size="26" font-weight="bold" text-anchor="middle">Export to Zotero (RIS file)</text>

  <!-- Bibliometric -->
  <rect x="830" y="1330" width="380" height="180" rx="18" fill="#FFFF99" stroke="#000" stroke-width="2"/>
  <text x="1020" y="1378" font-size="28" font-weight="bold" text-anchor="middle">Do the Bibliometric</text>
  <text x="1020" y="1420" font-size="30" font-weight="bold" text-anchor="middle">- VOSviewer</text>
  <text x="1020" y="1458" font-size="30" font-weight="bold" text-anchor="middle">- Python</text>
  <text x="1020" y="1496" font-size="30" font-weight="bold" text-anchor="middle">- Napkin</text>
  <line x1="500" y1="1240" x2="828" y2="1415" stroke="#000" stroke-width="3" marker-end="url(#arr)"/>
  <text x="560" y="1345" font-size="28" font-weight="bold">RIS file</text>

  <!-- Citation to Article (document shape) -->
  <path d="M270,1580 L570,1580 L570,1700 C510,1665 450,1660 400,1690 C350,1720 300,1715 270,1700 Z" fill="#FFCCFF" stroke="#000" stroke-width="2"/>
  <text x="420" y="1635" font-size="28" font-weight="bold" text-anchor="middle">Citation to Article</text>
  <line x1="420" y1="1240" x2="420" y2="1578" stroke="#000" stroke-width="3" marker-end="url(#arr)"/>
  <polyline points="1020,1510 1020,1640 572,1640" fill="none" stroke="#000" stroke-width="3" marker-end="url(#arr)"/>

  <!-- ===== STAGE 3: Writing (bottom) ===== -->
  <rect x="20" y="1770" width="1660" height="290" rx="24" fill="#F6FFF0" stroke="#5FA83A" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="50" y="1812" font-size="26" font-weight="bold" fill="#3D7A1F">Writing and Language Refinement</text>

  <polyline points="570,1680 650,1680 650,1945 698,1945" fill="none" stroke="#000" stroke-width="3" marker-end="url(#arr)"/>

  <rect x="700" y="1875" width="300" height="140" rx="18" fill="#E6FFCC" stroke="#000" stroke-width="2"/>
  <text x="850" y="1955" font-size="32" font-weight="bold" text-anchor="middle">Writing Article</text>

  <line x1="1000" y1="1945" x2="1078" y2="1945" stroke="#000" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="1080" y="1885" width="240" height="120" rx="14" fill="#fff" stroke="#3A7BD5" stroke-width="3"/>
  <text x="1200" y="1958" font-size="38" text-anchor="end">insta</text><text x="1200" y="1958" font-size="38" font-weight="bold" text-anchor="start">text</text>

  <line x1="1320" y1="1945" x2="1388" y2="1945" stroke="#000" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="1390" y="1885" width="260" height="120" rx="14" fill="#F7F7F7" stroke="#222" stroke-width="3"/>
  <text x="1528" y="1958" font-size="32" font-weight="bold" text-anchor="end">stealth</text><text x="1528" y="1958" font-size="32" text-anchor="start">writer</text>
</svg>
